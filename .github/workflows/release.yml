name: Release bundles

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    env:
      HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
      VJUMP_UPDATER_PUBKEY: ${{ vars.VJUMP_UPDATER_PUBKEY }}
      VJUMP_UPDATER_ENDPOINT: ${{ vars.VJUMP_UPDATER_ENDPOINT }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Linux bundle prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            build-essential patchelf

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: ui/package.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Set up Rust
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install UI dependencies
        run: pnpm -C ui install --frozen-lockfile

      - name: Validate release configuration
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs'
          const config = JSON.parse(fs.readFileSync('crates/desktop/tauri.conf.json', 'utf8'))
          if (process.env.GITHUB_REF_TYPE === 'tag' && process.env.GITHUB_REF_NAME !== `v${config.version}`) {
            throw new Error('The release tag must match tauri.conf.json version.')
          }
          if (process.env.HAS_UPDATER_KEY === 'true' && (!process.env.VJUMP_UPDATER_PUBKEY || !process.env.VJUMP_UPDATER_ENDPOINT)) {
            throw new Error('Signed updater builds need both VJUMP_UPDATER_PUBKEY and VJUMP_UPDATER_ENDPOINT repository variables.')
          }
          JS

      - name: Build platform bundles and create draft release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: crates/desktop
          # tauri-action runs this command from projectPath.
          tauriScript: node ../../scripts/tauri.mjs
          args: ${{ env.HAS_UPDATER_KEY == 'true' && '--config tauri.updater.conf.json' || '' }}
          tagName: v__VERSION__
          releaseName: v__VERSION__
          releaseDraft: true
          releaseBody: 'Windows and Linux x64 bundles. GPU setup runs on first launch. See README.md for requirements and signing status.'
          uploadUpdaterJson: ${{ env.HAS_UPDATER_KEY == 'true' }}
          updaterJsonPreferNsis: true

      - name: Inspect Debian runtime dependencies
        if: runner.os == 'Linux'
        run: |
          for bundle in target/release/bundle/deb/*.deb; do
            dpkg-deb --field "$bundle" Depends | tee /tmp/vjump-deb-dependencies
            grep -q 'libwebkit2gtk-4.1-0' /tmp/vjump-deb-dependencies
          done
