name: Release bundles

on:
  push:
    branches: [main]
    paths: ['crates/desktop/tauri.conf.json']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    outputs:
      release: ${{ steps.gate.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      # Bundles build only when a push changes the version, or on a manual run
      # for a version without a published release.
      - name: Check version change and release state
        id: gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync, readFileSync } from 'node:fs'
          import { execFileSync } from 'node:child_process'

          const run = (command, ...args) =>
            execFileSync(command, args, { encoding: 'utf8' }).trim()
          const finish = (release, message) => {
            if (message) console.log('::notice::' + message)
            appendFileSync(process.env.GITHUB_OUTPUT, 'release=' + release + '\n')
            process.exit(0)
          }
          const file = 'crates/desktop/tauri.conf.json'
          const version = JSON.parse(readFileSync(file, 'utf8')).version
          const tag = 'v' + version
          run('git', 'check-ref-format', 'refs/tags/' + tag)

          if (process.env.EVENT_NAME === 'push') {
            const before = process.env.BEFORE_SHA
            if (!before || /^0+$/.test(before)) {
              throw new Error('No previous revision; use a manual run to bootstrap.')
            }
            const previous = JSON.parse(run('git', 'show', before + ':' + file)).version
            if (previous === version) finish(false, 'Version unchanged; skipping bundles.')
          }

          const repo = 'repos/' + process.env.GITHUB_REPOSITORY
          const releases = JSON.parse(run('gh', 'api', repo + '/releases?per_page=100',
            '--paginate', '--slurp')).flat().filter(release => release.tag_name === tag)
          if (releases.length > 1) throw new Error('Multiple releases use ' + tag)
          const release = releases[0]
          if (release && !release.draft) finish(false, 'Published release already exists; skipping bundles.')
          if (release && release.target_commitish !== process.env.GITHUB_SHA) {
            throw new Error('Draft belongs to another commit; rerun its original workflow run.')
          }

          const refs = JSON.parse(run('gh', 'api', repo + '/git/matching-refs/tags/' + tag))
          if (refs.some(ref => ref.ref === 'refs/tags/' + tag)) {
            if (!release) throw new Error('Tag exists without a release; review it before continuing.')
            if (run('git', 'rev-parse', 'refs/tags/' + tag + '^{commit}') !== process.env.GITHUB_SHA) {
              throw new Error('Existing tag points to another commit.')
            }
          }
          finish(true)
          JS

  bundle:
    needs: version
    if: needs.version.outputs.release == 'true'
    strategy:
      fail-fast: false
      # One platform at a time so the first creates the draft release and the second reuses it.
      max-parallel: 1
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    env:
      HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
      VJUMP_UPDATER_PUBKEY: ${{ vars.VJUMP_UPDATER_PUBKEY }}
      VJUMP_UPDATER_ENDPOINT: ${{ vars.VJUMP_UPDATER_ENDPOINT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux bundle prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            build-essential patchelf

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ui/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Set up Rust
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install UI dependencies
        run: pnpm -C ui install --frozen-lockfile

      - name: Validate release configuration
        shell: bash
        run: |
          node --input-type=module <<'JS'
          if (process.env.HAS_UPDATER_KEY === 'true' && (!process.env.VJUMP_UPDATER_PUBKEY || !process.env.VJUMP_UPDATER_ENDPOINT)) {
            throw new Error('Signed updater builds need both VJUMP_UPDATER_PUBKEY and VJUMP_UPDATER_ENDPOINT repository variables.')
          }
          JS

      - name: Build platform bundles and create draft release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: crates/desktop
          # tauri-action runs this command from projectPath.
          tauriScript: node ../../scripts/tauri.mjs
          args: ${{ env.HAS_UPDATER_KEY == 'true' && '--config tauri.updater.conf.json' || '' }}
          tagName: v__VERSION__
          releaseName: v__VERSION__
          releaseDraft: true
          releaseBody: 'Windows and Linux x64 bundles. GPU setup runs on first launch. See README.md for requirements and signing status.'
          uploadUpdaterJson: ${{ env.HAS_UPDATER_KEY == 'true' }}
          updaterJsonPreferNsis: true
          # Also attach the unbundled Windows executable; tauri-action finds it through mainBinaryName.
          uploadPlainBinary: ${{ runner.os == 'Windows' }}

      - name: Inspect Debian runtime dependencies
        if: runner.os == 'Linux'
        run: |
          for bundle in target/release/bundle/deb/*.deb; do
            dpkg-deb --field "$bundle" Depends | tee /tmp/vjump-deb-dependencies
            grep -q 'libwebkit2gtk-4.1-0' /tmp/vjump-deb-dependencies
          done
