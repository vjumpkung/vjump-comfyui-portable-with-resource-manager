name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core-coverage:
    name: Core layers and coverage (no desktop libraries)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install coverage tools
        run: |
          rustup component add llvm-tools-preview
          cargo install cargo-llvm-cov --version 0.9.1 --locked
      - name: Domain coverage (90 percent)
        run: cargo llvm-cov -p domain --locked --fail-under-lines 90
      - name: Application coverage (80 percent)
        run: cargo llvm-cov -p application --locked --fail-under-lines 80

  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            build-essential

      # The pnpm version comes from the packageManager field in ui/package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ui/package.json

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      # Reads the channel and components from rust-toolchain.toml.
      - name: Set up Rust
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install UI dependencies
        run: pnpm -C ui install --frozen-lockfile

      - name: Lint UI
        run: pnpm -C ui lint

      - name: Typecheck UI
        run: pnpm -C ui typecheck

      - name: Test UI
        run: pnpm -C ui test

      # The desktop crate embeds ui/dist at compile time, so build the real UI first.
      - name: Build UI
        run: pnpm -C ui build

      - name: Rust format
        run: cargo fmt --all -- --check

      - name: Rust clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Rust tests
        run: cargo test --workspace --locked

      - name: Build desktop (release assets embedded)
        run: cargo build -p desktop --locked --features tauri/custom-protocol

      - name: Architecture dependency tests
        run: node --test scripts/check-arch-deps.test.mjs

      - name: Architecture dependency check
        run: node scripts/check-arch-deps.mjs
