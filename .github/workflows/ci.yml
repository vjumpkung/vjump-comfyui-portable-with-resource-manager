name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core-coverage:
    name: Core layers and coverage (no desktop libraries)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install coverage tools
        run: |
          rustup component add llvm-tools-preview
          cargo install cargo-llvm-cov --version 0.9.1 --locked
      - name: Domain coverage (90 percent)
        run: cargo llvm-cov -p domain --locked --fail-under-lines 90
      - name: Application coverage (80 percent)
        run: cargo llvm-cov -p application --locked --fail-under-lines 80

  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            build-essential

      # The pnpm version comes from the packageManager field in ui/package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: ui/package.json

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      # Reads the channel and components from rust-toolchain.toml.
      - name: Set up Rust
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install UI dependencies
        run: pnpm -C ui install --frozen-lockfile

      - name: Lint UI
        run: pnpm -C ui lint

      - name: Typecheck UI
        run: pnpm -C ui typecheck

      - name: Test UI
        run: pnpm -C ui test

      # The desktop crate embeds ui/dist at compile time, so build the real UI first.
      - name: Build UI
        run: pnpm -C ui build

      - name: Rust format
        run: cargo fmt --all -- --check

      - name: Rust clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Rust tests
        run: cargo test --workspace --locked

      - name: Build desktop (release assets embedded)
        run: cargo build -p desktop --locked --features tauri/custom-protocol

      - name: Architecture dependency tests
        run: node --test scripts/check-arch-deps.test.mjs

      - name: Architecture dependency check
        run: node scripts/check-arch-deps.mjs
