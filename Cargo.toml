[workspace]
members = ["crates/domain", "crates/application", "crates/infrastructure", "crates/desktop"]
resolver = "3"

[workspace.package]
version = "0.1.4"
edition = "2024"
rust-version = "1.99"

[workspace.dependencies]
domain = { path = "crates/domain" }
application = { path = "crates/application" }
infrastructure = { path = "crates/infrastructure" }
tauri = "=2.12.4"
tauri-build = "=2.7.3"
tauri-plugin-single-instance = "=2.5.3"
tauri-plugin-log = "=2.10.0"
tauri-specta = { version = "=2.0.0-rc.25", features = ["typescript"] }
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "=0.0.12"
tokio = "=1.53.3"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
rusqlite_migration = "=2.6.0"
keyring = { version = "=4.2.0", default-features = false, features = ["v1"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "fmt", "registry", "tracing-log"] }
tracing-appender = "=0.2.5"
file-rotate = "=0.8.0"
thiserror = "=2.0.21"
async-trait = "=0.1.92"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
dirs = "=7.0.0"
tempfile = "=3.27.0"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "stream", "json"] }
sha2 = "=0.11.1"
zip = { version = "=9.0.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }
tar = { version = "=0.4.46", default-features = false }
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
nvml-wrapper = "=0.13.0"
sysinfo = { version = "=0.39.0", default-features = false, features = ["disk", "system"] }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Registry", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_Pipes", "Win32_System_IO", "Win32_Storage_FileSystem", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock"] }
libc = "=0.2.190"
tauri-plugin-dialog = "=2.8.3"
tauri-plugin-opener = { version = "=2.5.4", default-features = false }
tauri-plugin-updater = "=2.14.0"
tauri-plugin-clipboard-manager = "=2.5.0"
serde_yaml_ng = { version = "=0.10.0", default-features = false }
url = "=2.5.8"
percent-encoding = "=2.3.2"
scraper = { version = "=0.25.0", default-features = false }
time = { version = "=0.3.55", default-features = false, features = ["std", "parsing"] }
trash = { version = "=5.2.9", default-features = false }
windows = { version = "=0.62.2", default-features = false, features = ["std", "Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell"] }
windows-core = { version = "=0.62.2", default-features = false, features = ["std"] }
webview2-com = "=0.39.1"
notify = { version = "=8.2.0", default-features = false }
walkdir = "=2.5.0"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
toml = { version = "=1.1.8", default-features = false, features = ["std", "parse", "serde"] }
semver = { version = "=1.0.28", default-features = false, features = ["std"] }
